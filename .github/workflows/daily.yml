name: Daily Boohoo Tracker

on:
  schedule:
    # 08:00 UTC = 09:00 UK time during BST
    - cron: "0 8 * * *"

  # Allows you to run it manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Boohoo tracker
        run: python tracker.py

      - name: Run PrettyLittleThing tracker
        run: python plt.py

      - name: Run BoohooMAN tracker
        run: python boohooman.py

      - name: Track Google Trends
        continue-on-error: true
        run: python trends.py

      - name: Build mobile dashboard
        run: python retail_dashboard.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Update daily Boohoo tracker"
          git push
