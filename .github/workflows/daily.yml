name: Daily Retail Discount Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Boohoo tracker
        run: python tracker.py

      - name: Run PLT tracker
        run: python plt.py

      - name: Save results
        run: |
          git config user.name "Retail Tracker"
          git config user.email "actions@github.com"
          git add latest.csv history.csv summary.csv
          git add plt_latest.csv plt_history.csv plt_summary.csv
          git diff --cached --quiet || git commit -m "Daily retail snapshot"
          git push
